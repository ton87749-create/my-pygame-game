name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install cython==0.29.36
          pip install buildozer
      - run: |
          yes | buildozer android debug 2>&1 | tee buildozer.log
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: bin/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: buildozer.log
